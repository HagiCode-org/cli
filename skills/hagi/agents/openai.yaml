interface:
  display_name: "Hagi CLI"
  short_description: "Answer questions about your HagiCode data and skills, including built-in skills, and operate the hagi CLI."
  default_prompt: "Use $hagi to look up your projects, proposals, sessions, vaults, plans, or skills, to enable or disable a built-in skill, or to inspect, run, or update the HagiCode CLI in repos/cli."

policy:
  allow_implicit_invocation: true
